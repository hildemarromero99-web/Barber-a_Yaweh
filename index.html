                       <!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barbería Yahweh</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: sans-serif; }
    .gold-bg { background-color: #d97706; }
    .gold-text { color: #f59e0b; }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 max-w-md mx-auto">

  <!-- Encabezado -->
  <div class="w-full text-center mt-6">
    <div class="w-24 h-24 rounded-full gold-bg flex items-center justify-center mx-auto mb-3 shadow-lg">
      <i class="fa-solid font-bold text-4xl text-slate-900 fa-scissors"></i>
    </div>
    <h1 class="text-2xl font-bold tracking-wide">BARBERÍA YAHWEH</h1>
    <p class="text-slate-400 text-sm mt-1">Estilo y Precisión Profesional</p>
    
    <!-- Dirección -->
    <p class="text-xs text-amber-500/90 mt-2 px-2">
      <i class="fa-solid fa-location-dot mr-1"></i>
      Maturín, Av. Bicentenario, diagonal al estacionamiento del Hotel Luciano Junior
    </p>
  </div>

  <!-- Redes Sociales -->
  <div class="flex gap-4 my-4">
    <a href="https://instagram.com/barberia-yahweh" target="_blank" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
      <i class="fa-brands fa-instagram text-xl"></i>
    </a>
    <a href="https://tiktok.com/@barberiayaweh" target="_blank" class="w-10 h-10 rounded-full bg-slate-800 flex items-center justify-center text-slate-300 hover:text-white transition">
      <i class="fa-brands fa-tiktok text-xl"></i>
    </a>
  </div>

  <!-- Servicios / Agendar -->
  <div class="w-full space-y-3 my-2">
    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 text-center">Reserva tu cita</h2>

    <button onclick="openBooking('Corte Básico ($6.00)')" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl flex justify-between items-center border border-slate-700 shadow">
      <span class="font-medium">Corte Básico</span>
      <span class="gold-text font-bold">$6.00</span>
    </button>

    <button onclick="openBooking('Corte y Barba ($8.00)')" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl flex justify-between items-center border border-slate-700 shadow">
      <span class="font-medium">Corte y Barba</span>
      <span class="gold-text font-bold">$8.00</span>
    </button>

    <button onclick="openBooking('Servicio Premium ($10.00)')" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl flex justify-between items-center border border-slate-700 shadow">
      <span class="font-medium">Servicio Premium</span>
      <span class="gold-text font-bold">$10.00</span>
    </button>

    <button onclick="openBooking('Solo Barba ($3.00)')" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl flex justify-between items-center border border-slate-700 shadow">
      <span class="font-medium">Solo Barba</span>
      <span class="gold-text font-bold">$3.00</span>
    </button>

    <button onclick="openBooking('Limpieza Facial ($3.00)')" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl flex justify-between items-center border border-slate-700 shadow">
      <span class="font-medium">Limpieza Facial</span>
      <span class="gold-text font-bold">$3.00</span>
    </button>

    <button onclick="openBooking('Cejas ($1.50)')" class="w-full bg-slate-800 hover:bg-slate-700 p-3 rounded-xl flex justify-between items-center border border-slate-700 shadow">
      <span class="font-medium">Cejas</span>
      <span class="gold-text font-bold">$1.50</span>
    </button>
  </div>

  <!-- Modal de Reserva -->
  <div id="bookingModal" class="fixed inset-0 bg-black/80 hidden items-center justify-center p-4">
    <div class="bg-slate-800 p-6 rounded-2xl w-full max-w-xs border border-slate-700 space-y-4">
      <h3 id="serviceTitle" class="text-lg font-bold text-center gold-text"></h3>
      <div>
        <label class="text-xs text-slate-400">Tu Nombre</label>
        <input type="text" id="clientName" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 mt-1 text-white focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="text-xs text-slate-400">Fecha</label>
        <input type="date" id="bookingDate" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 mt-1 text-white focus:outline-none focus:border-amber-500">
      </div>
      <div>
        <label class="text-xs text-slate-400">Hora</label>
        <input type="time" id="bookingTime" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 mt-1 text-white focus:outline-none focus:border-amber-500">
      </div>
      <div class="flex gap-2 pt-2">
        <button onclick="closeModal()" class="w-1/2 bg-slate-700 hover:bg-slate-600 p-2 rounded-lg text-sm">Cancelar</button>
        <button onclick="sendWhatsApp()" class="w-1/2 gold-bg font-bold p-2 rounded-lg text-sm text-slate-900">Agendar</button>
      </div>
    </div>
  </div>

  <!-- Footer / Datos de Pago y Ubicación -->
  <div class="w-full text-center text-xs text-slate-500 my-4 space-y-1">
    <p><strong>Pago Móvil:</strong> Bancamiga (0172)</p>
    <p>CI: V-26.655.507 | Tel: 0412-2799156</p>
  </div>

  <script>
    let selectedService = '';
    const myPhone = "584122799156"; // Número correcto 0412

    function openBooking(service) {
      selectedService = service;
      document.getElementById('serviceTitle').innerText = service;
      document.getElementById('bookingModal').classList.remove('hidden');
      document.getElementById('bookingModal').classList.add('flex');
    }

    function closeModal() {
      document.getElementById('bookingModal').classList.add('hidden');
      document.getElementById('bookingModal').classList.remove('flex');
    }

    function sendWhatsApp() {
      const name = document.getElementById('clientName').value;
      const date = document.getElementById('bookingDate').value;
      const time = document.getElementById('bookingTime').value;

      if (!name || !date || !time) {
        alert('Por favor completa todos los campos.');
        return;
      }

      const msg = `¡Hola Barbería Yahweh! Quisiera agendar una cita:\n\n❖ Servicio: ${selectedService}\n❖ Nombre: ${name}\n❖ Fecha: ${date}\n❖ Hora: ${time}`;
      const url = `https://wa.me/${myPhone}?text=${encodeURIComponent(msg)}`;
      window.open(url, '_blank');
      closeModal();
    }
  </script>
</body>
</html>
